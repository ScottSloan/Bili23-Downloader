name: Quality

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # 与 requires-python 的下限一致

      - name: Install ruff
        run: pip install ruff==0.16.7

      # 门禁：只包含无歧义的破坏性错误，当前为 0，不允许新增
      - name: Lint (gate)
        run: ruff check src test

      # 报告层：不进门禁但值得持续可见的规则，见 pyproject 中逐条说明的理由。
      # S110 与 RUF012 已清零并转为门禁，此处只剩 BLE001。
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check src test --select BLE001 --statistics

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 不进矩阵：offscreen 平台插件在真正 show() 窗口、模拟鼠标拖拽的
        # GUI 用例上会段错误，且布局断言受 macOS 字体度量影响与另两个平台不一致。
        # 这是 CI 环境问题而非产品问题，不值得为它给用例撒一层平台分支
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 在无头 Linux 上需要这些系统库才能完成导入，
      # 缺失时 libEGL.so.1 找不到，测试会在 import 阶段就失败
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1

      # 测试只导入模块、不创建窗口，但 PySide6 在 Linux 上仍要求有可用的平台插件
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
